<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EventHub - Discover Amazing Events</title>
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="container">
            <div class="header-content">
                <div class="logo" onclick="showHome()">
                    <i class="fas fa-calendar-alt"></i>
                    <span>EventHub</span>
                </div>
                
                <nav class="nav">
                    <div class="nav-link primary" onclick="showHome()">
                        <span>Browse Events</span>
                    </div>
                    <div class="nav-link" onclick="showMyBookings()">
                        <i class="fas fa-ticket-alt"></i>
                        <span>My Bookings</span>
                    </div>
                </nav>
            </div>
        </div>
    </header>

    <!-- Hero Section -->
    <section class="hero" id="heroSection">
        <div class="container">
            <div class="hero-content">
                <h1>Discover Amazing Events</h1>
                <p>Find and book tickets for concerts, conferences, sports, and more</p>
                
                <!-- Search Bar -->
                <div class="search-wrapper">
                    <i class="fas fa-search search-icon"></i>
                    <input 
                        type="text" 
                        class="search-input" 
                        placeholder="Search events by name, location, or keyword..."
                        id="searchInput"
                    >
                </div>
            </div>
        </div>
    </section>

    <!-- Category Filter -->
    <div class="category-bar" id="categoryBar">
        <div class="container">
            <div class="category-filters" id="categoryFilters">
                <button class="category-btn active" data-category="All">All</button>
                <button class="category-btn" data-category="Music">Music</button>
                <button class="category-btn" data-category="Technology">Technology</button>
                <button class="category-btn" data-category="Food">Food</button>
                <button class="category-btn" data-category="Sports">Sports</button>
                <button class="category-btn" data-category="Art">Art</button>
                <button class="category-btn" data-category="Entertainment">Entertainment</button>
                <button class="category-btn" data-category="Business">Business</button>
                <button class="category-btn" data-category="Education">Education</button>
                <button class="category-btn" data-category="Wellness">Wellness</button>
            </div>
        </div>
    </div>

    <!-- Main Content Area -->
    <div id="mainContent">
        <!-- Events Grid Section -->
        <section class="events-section">
            <div class="container">
                <div class="events-header">
                    <div class="events-count" id="eventsCount">12 events found</div>
                </div>

                <div class="events-grid" id="eventsGrid">
                    <!-- Events will be dynamically inserted here -->
                </div>

                <!-- No events template (hidden by default) -->
                <div class="no-events" id="noEvents" style="display: none;">
                    <i class="fas fa-calendar-times"></i>
                    <p>No events found matching your criteria.</p>
                    <button class="clear-filters" onclick="clearFilters()">Clear filters</button>
                </div>
            </div>
        </section>
    </div>

    <!-- My Bookings Section (Hidden by default) -->
    <div id="myBookingsSection" style="display: none;">
        <section class="events-section">
            <div class="container">
                <div class="events-header" style="text-align: center; border-bottom: none; padding-bottom: 0;">
                    <h2>My Bookings</h2>
                </div>
                
                <div class="bookings-list" id="bookingsList">
                    <!-- Bookings will be shown here -->
                </div>
            </div>
        </section>
    </div>

    <!-- Event Details Modal -->
    <div id="eventModal" class="modal" style="display: none;">
        <div class="modal-overlay" onclick="closeModal()"></div>
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal()">
                <i class="fas fa-times"></i>
            </button>
            <div id="modalContent"></div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <p>© 2026 EventHub. All rights reserved.</p>
            </div>
        </div>
    </footer>

<!-- JavaScript File -->
<script src="script.js"></script>

</body>
</html>
